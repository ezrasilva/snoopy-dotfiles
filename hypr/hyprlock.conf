source = ~/.config/hypr/colors/snoopy-day.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.85
    vignette = 0.25
}

# Relógio grande, estilo título de tirinha
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $bg0
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $fg
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
}

# Campo de senha: mesma borda vermelha e cantos redondos das janelas
input-field {
    monitor =
    size = 320, 58
    rounding = 14
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $red
    inner_color = $bg0
    font_color = $fg
    check_color = $yellow
    fail_color = $orange
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = <i>🐾 senha, por favor</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    shadow_passes = 2
    shadow_size = 0
    shadow_color = $fg
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = "Happiness is a warm puppy."
    color = $fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font Italic
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $bg0
    position = 0, 60
    halign = center
    valign = bottom
}
